[project]
name = "prose"
version = "3.3.4"
description = "Modular image processing pipelines for Astronomy"
authors = [{name = "Lionel Garcia"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
    "numpy>=1.23.5",
    "astropy>=5.1.1",
    "astroquery>=0.4.6",
    "requests>=2.31.0",
    "ipython",
    "scipy",
    "matplotlib<3.9",
    "scikit-image>=0.21.0",
    "pandas>1.1",
    "rich",
    "photutils>=1.6.0",
    "pyyaml",
    "tabulate",
    "sep",
    "celerite2",
    "twirl==0.4.0",
    "multiprocess",
    "pytest",
    "imageio[ffmpeg]",
]

[project.optional-dependencies]
dev = ["pytest", "black", "mypy>=1.19.1"]
jax = ["jax>=0.4.26", "jaxopt"]
docs = [
    "sphinx",
    "docutils",
    "jupyterlab",
    "myst-parser",
    "sphinx-book-theme>=1.0.0",
    "myst-nb",
    "sphinx-copybutton",
    "sphinx-design",
    "toml",
    "ipywidgets",
]

[project.scripts]
fitsmanager = "prose.scripts.fitsmanager:main"
photometry = "prose.scripts.run_photometry:main"
solve-wcs = "prose.scripts.solve_wcs_astrometry:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "prose"
version = "3.3.4"
description = "Modular image processing pipelines for Astronomy"
authors = ["Lionel Garcia"]
license = "MIT"
readme = "README.md"
include = ["prose/io/*.sql"]

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
numpy = "^1.23.5"
astropy = "^5.1.1"
astroquery = "^0.4.6"
requests = "^2.31.0"
ipython = "*"
scipy = "*"
matplotlib = "*"
scikit-image = "^0.21.0"
pandas = ">1.1"
rich = "*"
photutils = "^1.6.0"
pyyaml = "*"
tabulate = "*"
sep = "*"
celerite2 = "*"
twirl = "0.4.0"
multiprocess = "*"
pytest = "*"
imageio = { version = "*", extras = ["ffmpeg"] }

[tool.poetry.group.dev.dependencies]
pytest = "*"
black = "*"

[tool.poetry.group.jax.dependencies]
jax = "^0.4.26"
jaxopt = "*"

[tool.poetry.group.docs.dependencies]
sphinx = "*"
docutils = "*"
jupyterlab = "*"
myst-parser = "*"
sphinx-book-theme = "^1.0.0"
myst-nb = "*"
sphinx-copybutton = "*"
sphinx-design = "*"
toml = "*"
ipywidgets = "*"

[tool.poetry.scripts]
fitsmanager = 'prose.scripts.fitsmanager:main'
photometry = 'prose.scripts.run_photometry:main'
solve-wcs = 'prose.scripts.solve_wcs_astrometry:main'

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]
